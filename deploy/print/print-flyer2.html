<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1050px; height: 1500px;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    overflow: hidden;
  }
  .page {
    width: 1050px; height: 1500px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(120% 55% at 15% 0%, rgba(217,168,74,0.20), transparent 55%),
      linear-gradient(200deg, #24344f 0%, #16233c 32%, #101a2d 60%, #0a1220 100%);
    color: #fdfbf6;
  }
  .ring {
    position: absolute; top: -70px; right: -110px;
    width: 300px; height: 300px;
    border: 1.5px solid rgba(217,168,74,0.45);
    border-radius: 50%;
  }

  /* ---- abstract dusk skyline (no real photo) ---- */
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 980px; }
  .sky-glow {
    position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: linear-gradient(180deg, transparent 0%, rgba(217,168,74,0.14) 60%, rgba(217,168,74,0.07) 100%);
  }
  .bld { position: absolute; bottom: 0; background: #0c1526; border-top: 1px solid rgba(217,168,74,0.18); }
  .bld-win { position: absolute; left: 10%; right: 10%; top: 22px; bottom: 40px; background-image: repeating-linear-gradient(0deg, rgba(230,195,116,0.35) 0 3px, transparent 3px 16px), repeating-linear-gradient(90deg, rgba(230,195,116,0.35) 0 3px, transparent 3px 16px); background-blend-mode: screen; opacity: 0.5; }
  .bld-main {
    left: 560px; width: 180px; height: 780px;
    background: linear-gradient(180deg, #1c2c4a 0%, #0c1526 100%);
  }
  .bld-main .cap { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-family: "Cormorant Garamond", serif; font-size: 16px; letter-spacing: 0.35em; color: #e6c374; writing-mode: vertical-rl; }

  /* ---- header text ---- */
  .head { position: relative; z-index: 3; padding: 92px 70px 0; }
  .rule { width: 60px; height: 4px; background: #d9a84a; margin-bottom: 22px; }
  .tag {
    display: inline-block; font-size: 16px; font-weight: 700; letter-spacing: 0.04em;
    color: #f4e6c8; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(244,230,200,0.35); padding: 7px 18px; border-radius: 999px;
    margin-bottom: 26px;
  }
  .title-1 { font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 46px; margin: 0; letter-spacing: -0.01em; color: #fdfbf6; }
  .title-2 { font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 46px; margin: 2px 0 18px; letter-spacing: -0.01em; color: #e6c374; }
  .sub { font-size: 20px; color: #cdd4e4; margin: 0 0 22px; font-weight: 500; }
  .sub b { color: #f4e6c8; font-weight: 700; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 15px; font-weight: 700; color: #f4e6c8;
    border: 1px solid rgba(217,168,74,0.55); padding: 7px 16px; border-radius: 999px;
  }

  /* ---- top-right wordmark ---- */
  .wordmark { position: absolute; top: 96px; right: 70px; text-align: right; z-index: 3; }
  .wordmark .ipark { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 26px; letter-spacing: 0.14em; color: #e6c374; }
  .wordmark .wm-rule { width: 34px; height: 1px; background: rgba(230,195,116,0.6); margin: 8px 0 8px auto; }
  .wordmark .tagline { font-family: "Cormorant Garamond", serif; font-size: 14px; letter-spacing: 0.1em; color: #cdd4e4; line-height: 1.6; }

  /* ---- QR card ---- */
  .qr-card {
    position: absolute; left: 70px; bottom: 340px; z-index: 3;
    width: 380px;
    background: #f6f0e2;
    border: 1.5px solid #d9a84a;
    border-radius: 26px;
    padding: 38px 32px;
    box-shadow: 0 30px 60px -24px rgba(0,0,0,0.55);
  }
  .qr-card img { width: 148px; height: 148px; border-radius: 10px; background: #fff; padding: 8px; display: block; margin-bottom: 18px; }
  .qr-card h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; color: #17233d; line-height: 1.35; }
  .qr-card h2 b { color: #a3701f; }
  .qr-card .divider { width: 100%; height: 1px; background: #ddd2b8; margin: 16px 0; }
  .qr-card p { margin: 0; font-size: 14px; color: #55534a; line-height: 1.6; }

  /* ---- bottom brand bar ---- */
  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    background: #0e1626; border-top: 1px solid rgba(217,168,74,0.35);
    padding: 26px 70px; display: flex; align-items: center; gap: 16px;
  }
  .bottom .icon { width: 44px; height: 44px; flex-shrink: 0; }
  .bottom .brand { flex: 1; }
  .bottom .brand-name { font-family: "Noto Serif KR", serif; font-size: 21px; font-weight: 700; color: #fdfbf6; }
  .bottom .brand-name b { color: #e6c374; }
  .bottom .brand-tag { font-size: 12px; color: #9aa4b8; margin-top: 3px; }
  .bottom .phone { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 900; color: #fdfbf6; font-variant-numeric: tabular-nums; }
  .bottom .phone svg { width: 18px; height: 18px; color: #e6c374; }
</style>
</head>
