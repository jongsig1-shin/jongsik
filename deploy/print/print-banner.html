<head>
<meta charset="utf-8">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1200px; height: 3600px;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    overflow: hidden;
  }
  .banner {
    width: 1200px; height: 3600px;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(140% 60% at 50% 0%, rgba(185,134,47,0.32), transparent 55%),
      linear-gradient(190deg, #223257 0%, #17233d 45%, #0e1626 100%);
    color: #fdfbf6;
    position: relative;
    overflow: hidden;
  }
  .banner::before {
    content: "";
    position: absolute;
    top: -220px; right: -260px;
    width: 900px; height: 900px;
    border: 3px solid rgba(217,168,74,0.22);
    border-radius: 50%;
  }
  .banner::after {
    content: "";
    position: absolute;
    bottom: 620px; left: -320px;
    width: 760px; height: 760px;
    border: 3px solid rgba(217,168,74,0.14);
    border-radius: 50%;
  }

  .head { padding: 150px 100px 0; text-align: center; position: relative; z-index: 2; }
  .tag {
    display: inline-block; font-size: 30px; font-weight: 700; letter-spacing: 0.06em;
    color: #f4e6c8; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(244,230,200,0.35); padding: 12px 30px; border-radius: 999px;
    margin-bottom: 46px;
  }
  .title {
    font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 120px; line-height: 1.28;
    margin: 0 0 30px; letter-spacing: -0.01em;
  }
  .sub { font-size: 38px; color: #cdd4e4; font-weight: 500; margin: 0 0 56px; }
  .sub b { color: #f4e6c8; font-weight: 700; }

  .chips { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; position: relative; z-index: 2; }
  .chip {
    font-size: 30px; font-weight: 700; color: #f4e6c8;
    border: 1px solid rgba(217,168,74,0.55); padding: 14px 30px; border-radius: 999px;
  }

  .units {
    margin: 90px 100px 0;
    display: flex;
    gap: 30px;
    position: relative; z-index: 2;
  }
  .unit-box {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(244,230,200,0.3);
    border-radius: 28px;
    padding: 44px 20px;
    text-align: center;
  }
  .unit-box .label { font-size: 26px; font-weight: 700; color: #cdb987; margin-bottom: 14px; }
  .unit-box .value { font-size: 54px; font-weight: 900; color: #fdfbf6; font-family: "Noto Serif KR", serif; }

  .spacer { flex: 1; }

  .qr-card {
    margin: 0 100px 70px;
    background: linear-gradient(135deg, #e6c374 0%, #c6963a 60%, #b3852d 100%);
    border-radius: 48px;
    padding: 70px 60px;
    text-align: center;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.55);
    position: relative; z-index: 2;
  }
  .qr-card img {
    width: 420px; height: 420px;
    border-radius: 28px;
    background: #fff;
    padding: 18px;
    margin-bottom: 40px;
  }
  .qr-card h2 { margin: 0 0 16px; font-size: 56px; font-weight: 900; color: #1c1206; }
  .qr-card p { margin: 0; font-size: 30px; font-weight: 600; color: #4a3612; line-height: 1.5; }

  .bottom {
    background: #ffffff;
    padding: 70px 100px 110px;
    text-align: center;
    position: relative; z-index: 2;
  }
  .brand-name { font-family: "Noto Serif KR", serif; font-size: 52px; font-weight: 700; color: #17233d; margin: 0 0 20px; }
  .brand-name b { color: #b9862f; }
  .phone {
    display: flex; align-items: center; gap: 18px; justify-content: center;
    font-size: 74px; font-weight: 900; color: #17233d; font-variant-numeric: tabular-nums; margin-bottom: 14px;
  }
  .phone svg { width: 56px; height: 56px; color: #b9862f; }
  .brand-tag { font-size: 28px; color: #6b7280; font-weight: 500; }
</style>
</head>
