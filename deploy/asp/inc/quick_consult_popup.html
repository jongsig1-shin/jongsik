<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빠른상담 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: transparent;
  }
  .qp-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .qp-card {
    width: 100%; max-width: 380px;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.4);
    position: relative;
  }
  .qp-head {
    position: relative;
    background:
      radial-gradient(120% 140% at 15% 0%, rgba(185,134,47,0.5), transparent 55%),
      linear-gradient(155deg, #223257 0%, #17233d 60%, #0e1626 100%);
    padding: 22px 24px 20px;
    color: #fdfbf6;
  }
  .qp-close {
    position: absolute; top: 12px; right: 12px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1;
  }
  .qp-tag {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    color: #f4e6c8; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(244,230,200,0.35); padding: 4px 10px; border-radius: 999px;
    margin-bottom: 10px;
  }
  .qp-head h1 {
    font-family: "Noto Serif KR", serif; font-size: 21px; font-weight: 700;
    margin: 0 0 6px; line-height: 1.3;
  }
  .qp-head p { margin: 0; font-size: 12.5px; color: #cdd4e4; }

  .qp-body { padding: 18px 22px 22px; }

  .qp-qr-block {
    display: flex; align-items: center; gap: 12px;
    background: #f6f6f6; border-radius: 12px; padding: 10px 14px; margin-bottom: 16px;
  }
  .qp-qr-block img { border-radius: 6px; flex-shrink: 0; }
  .qp-qr-text { display: flex; flex-direction: column; gap: 2px; }
  .qp-qr-text b { font-size: 12.5px; color: #17233d; }
  .qp-qr-text span { font-size: 11px; color: #6b7280; line-height: 1.5; }

  .qp-field { margin-bottom: 12px; }
  .qp-field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #6b7280; }
  .qp-field label .qp-req { color: #b0392c; margin-left: 2px; }
  .qp-field input, .qp-field select {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #d8dbe4;
    background: #f6f6f6; color: #17233d; font-size: 14px; font-family: inherit;
  }
  .qp-field select option { color: #17233d; background: #ffffff; }
  .qp-field input::placeholder { color: #9aa0ab; }
  .qp-field input:focus, .qp-field select:focus { outline: 2px solid #b9862f; outline-offset: 1px; }

  .qp-consent { display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; color: #6b7280; margin: 14px 0 14px; line-height: 1.55; }
  .qp-consent input { margin-top: 2px; width: 15px; height: 15px; accent-color: #b9862f; flex-shrink: 0; }
  .qp-consent a { color: #17233d; text-decoration: underline; }

  .qp-actions { display: flex; gap: 8px; }
  #qpSubmit {
    flex: 1; min-width: 0; border: 0; padding: 14px; border-radius: 12px; background: #b9862f;
    color: #2a1d08; font-weight: 900; font-size: 15px; cursor: pointer;
  }
  #qpSubmit:disabled { opacity: .4; cursor: not-allowed; }
  .qp-call-btn {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 14px 16px; border-radius: 12px; background: #17233d; color: #fdfbf6;
    font-weight: 900; font-size: 14px; text-decoration: none; white-space: nowrap;
  }
  .qp-call-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  #qpSuccess { display: none; flex-direction: column; align-items: center; text-align: center; padding: 10px 4px 4px; }
  #qpSuccess.show { display: flex; }
  #qpSuccess .qp-tick {
    width: 46px; height: 46px; border-radius: 50%; background: rgba(44,110,79,.15);
    display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
  }
  #qpSuccess p { margin: 0 0 18px; font-size: 12.5px; color: #6b7280; line-height: 1.6; }
  #qpSuccess button { border: 1px solid #d8dbe4; background: transparent; color: #17233d; padding: 10px 22px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
  #qpFormBody.hide { display: none; }

  .qp-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-top: 1px solid #eee;
    font-size: 12px; color: #6b7280;
  }
  .qp-foot label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .qp-foot input { accent-color: #b9862f; }
  .qp-foot .qp-call { color: #17233d; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

          <div class="qp-qr-text">
            <b>QR로도 신청 가능</b>
            <span>휴대폰으로 스캔하면 이 화면이 바로 열립니다</span>
          </div>
        </div>

        <div id="qpFormBody">
          <div class="qp-field">
            <label for="qpName">이름<span class="qp-req">*</span></label>
            <input id="qpName" type="text" placeholder="홍길동" autocomplete="name">
          </div>
          <div class="qp-field">
            <label for="qpPhone">연락처<span class="qp-req">*</span></label>
            <input id="qpPhone" type="tel" placeholder="010-0000-0000" autocomplete="tel">
          </div>
          <div class="qp-field">
            <label for="qpUnit">관심 평형 (선택)</label>
            <select id="qpUnit">
              <option value="">선택 안 함</option>
              <option value="84㎡">전용 84㎡</option>
              <option value="85㎡초과">전용 85㎡초과</option>
            </select>
          </div>
          <label class="qp-consent">
            <input type="checkbox" id="qpConsent">
            <span>개인정보 수집·이용에 동의합니다 (필수) - 상담 목적 외 사용하지 않으며 상담 완료 후 파기됩니다. <a href="/web/inc/privacy_consult.html" target="_blank">약관 보기</a></span>
          </label>

            <button id="qpSubmit" disabled>상담 신청하기</button>
            <a class="qp-call-btn" href="tel:010-7175-2700" aria-label="전화문의">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
              전화문의
            </a>
          </div>
        </div>

          <div class="qp-tick">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2c6e4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <p>영업일 기준 1일 이내 상담원이 순차 연락드립니다.</p>
          <button id="qpCloseSuccess" type="button">닫기</button>
        </div>
      </div>

      <div class="qp-foot">
        <label><input type="checkbox" id="qpHideToday"> 오늘 하루 보지 않기</label>
        <a class="qp-call" href="tel:010-7175-2700">☎ 010-7175-2700</a>
      </div>
    </div>
  </div>

<script>
(function () {
  var nameInput = document.getElementById('qpName');
  var phoneInput = document.getElementById('qpPhone');
  var unitSelect = document.getElementById('qpUnit');
  var consent = document.getElementById('qpConsent');
  var submitBtn = document.getElementById('qpSubmit');
  var formBody = document.getElementById('qpFormBody');
  var success = document.getElementById('qpSuccess');
  var hideToday = document.getElementById('qpHideToday');

  function notifyClose(hide) {
    if (window.self !== window.top) {
      // main.asp의 로더 스크립트가 iframe으로 띄운 경우: 부모 창에 닫기 신호 전달
      parent.postMessage(hide ? 'qc-popup-hide-today' : 'qc-popup-close', '*');
    } else {
      // 네이버 블로그 등 외부에서 이 페이지를 직접 링크로 열어 단독 화면으로 뜬 경우:
      // 닫을 부모 창이 없으므로 엘리트공인중개사사무소 블로그로 이동
      window.location.href = 'https://m.blog.naver.com/missmesj/224385777788';
    }
  }

  document.getElementById('qpClose').addEventListener('click', function () {
    notifyClose(hideToday.checked);
  });
  document.getElementById('qpCloseSuccess').addEventListener('click', function () {
    notifyClose(hideToday.checked);
  });

  function validate() {
    submitBtn.disabled = !(nameInput.value.trim() && phoneInput.value.trim() && consent.checked);
  }
  [nameInput, phoneInput, consent].forEach(function (el) { el.addEventListener('input', validate); });

  function getSrcParam() {
    var m = window.location.search.match(/[?&]src=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  submitBtn.addEventListener('click', function () {
    submitBtn.disabled = true;
    var body = new URLSearchParams({
      name: nameInput.value.trim(),
      phone: phoneInput.value.trim(),
      unit: unitSelect.value,
      message: '',
      consent: consent.checked ? '1' : '0',
      src: getSrcParam()
    });
    fetch('/web/inc/consult_proc.asp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.ok) {
          formBody.classList.add('hide');
          success.classList.add('show');
        } else {
          alert(data.error || '신청 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
          submitBtn.disabled = false;
        }
      })
      .catch(function () {
        alert('네트워크 오류로 신청에 실패했습니다. 전화상담을 이용해주세요.');
        submitBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
